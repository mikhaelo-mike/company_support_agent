[project]
name = "company-support-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.4",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.7",
    "langchain-google-genai>=4.4.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
company-support-agent = "company_support_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
